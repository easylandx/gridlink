<style>
:root{
  --ink:#14122b;
  --cyan:#00b8ff;
  --violet:#7c3aed;
  --line:rgba(110,80,220,.14);
  --tile-a:#ffffff;
  --tile-b:#f5f3ff;
  --gap:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  color:var(--ink);
  min-height:100vh;
  background-color:#fff;
  /* faint technical grid + soft light aurora, white stays dominant */
  background-image:
    radial-gradient(60% 40% at 15% 0%,rgba(0,184,255,.10),transparent 70%),
    radial-gradient(55% 40% at 90% 8%,rgba(124,58,237,.10),transparent 70%),
    linear-gradient(rgba(90,70,200,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(90,70,200,.045) 1px,transparent 1px);
  background-size:auto,auto,36px 36px,36px 36px;
  background-attachment:fixed;
}

/* Side margins live on the page container (longhand so nothing zeroes them out) */
.page{
  width:100%;
  max-width:1200px;
  margin-left:auto;
  margin-right:auto;
  padding-left:max(clamp(18px,7vw,120px),env(safe-area-inset-left,0px));
  padding-right:max(clamp(18px,7vw,120px),env(safe-area-inset-right,0px));
  padding-top:max(clamp(16px,3vw,32px),env(safe-area-inset-top,0px));
  padding-bottom:max(clamp(24px,5vw,60px),env(safe-area-inset-bottom,0px));
  min-height:100vh;
  display:flex;flex-direction:column;
}

/* Top bar */
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:auto;
  padding-top:clamp(20px,4vw,40px);
}
.pill,.sound{
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;
  height:44px;border-radius:999px;
  color:var(--ink);text-decoration:none;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.02em;
  background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,var(--cyan),var(--violet)) border-box;
  border:1.5px solid transparent;
  box-shadow:0 8px 22px -12px rgba(124,58,237,.55);
  transition:transform .2s ease,box-shadow .2s ease,color .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.pill{padding-left:22px;padding-right:22px}
.sound{width:44px;padding:0}
.pill:hover,.sound:hover{transform:translateY(-2px);box-shadow:0 12px 26px -10px rgba(0,184,255,.6)}
.pill:active,.sound:active{transform:scale(.97)}
.pill:focus-visible,.sound:focus-visible,.cell:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.sound svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sound .waves{transition:opacity .2s ease}
.sound[aria-pressed="false"] .waves{opacity:0}
.sound .mute{opacity:0;transition:opacity .2s ease}
.sound[aria-pressed="false"] .mute{opacity:1}
.sound[aria-pressed="true"]{color:var(--violet)}

/* Grid */
.grid{
  width:100%;max-width:980px;margin-left:auto;margin-right:auto;
  display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:auto;gap:var(--gap);
}
.wide{
  grid-column:1/-1;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  width:100%;max-width:300px;margin-left:auto;margin-right:auto;
  padding-top:4px;padding-bottom:12px;
  overflow:hidden;
  border-radius:20px;
}
.wide .twitter-tweet,.wide .twitter-timeline{max-width:100%!important}
.wide.banner{max-width:100%;overflow:visible;padding:0}
.banner-link{position:relative;display:block;width:100%;aspect-ratio:1776/576;border-radius:20px;overflow:hidden;line-height:0;
  background:#f4efe8;box-shadow:0 14px 30px -20px rgba(70,50,190,.55);border:1px solid var(--line);
  transition:transform .25s ease,box-shadow .25s ease}
.banner-slide{position:absolute;inset:0}
.banner-bg{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(18px)}
.banner-img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}
@media(hover:hover){.banner-link:hover{transform:translateY(-2px);box-shadow:0 18px 34px -18px rgba(70,50,190,.6)}}

.cell{
  position:relative;
  height:132px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-decoration:none;color:var(--ink);border-radius:22px;
  font-size:15px;font-weight:500;line-height:1.15;text-align:center;letter-spacing:.01em;
  background:linear-gradient(145deg,var(--tile-a),var(--tile-b));
  border:1px solid var(--line);
  box-shadow:0 10px 24px -18px rgba(70,50,190,.5);
  overflow:hidden;
  isolation:isolate;
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
  -webkit-tap-highlight-color:transparent;
  animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:calc(var(--i,0) * 18ms);
}
/* neon edge */
.cell::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;
  background:linear-gradient(130deg,var(--cyan),var(--violet));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .25s ease;pointer-events:none;
}
/* light sweep */
.cell::after{
  content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;z-index:-1;
  background:linear-gradient(100deg,transparent,rgba(0,184,255,.16),transparent);
  transform:skewX(-18deg);pointer-events:none;
}
.cell img{display:block;border:0;max-width:62%;height:auto;transition:transform .3s cubic-bezier(.34,1.56,.64,1),filter .3s ease}
.cell span{margin-top:6px;transition:color .25s ease,transform .25s ease}

@media(hover:hover){
  .cell:hover{transform:translateY(-4px);box-shadow:0 18px 32px -16px rgba(0,184,255,.55),0 0 0 4px rgba(124,58,237,.06)}
  .cell:hover::before{opacity:1}
  .cell:hover::after{left:130%;transition:left .7s ease}
  .cell:hover img{transform:scale(1.1) rotate(-3deg);filter:drop-shadow(0 8px 10px rgba(60,40,200,.28))}
  .cell:hover span{color:var(--violet);transform:translateY(1px)}
}
.cell:active{transform:scale(.97)}
.cell:focus-visible::before{opacity:1}

.empty{visibility:hidden;animation:none;border:0;box-shadow:none;background:none}
.empty::before,.empty::after{display:none}

@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

/* Tablet & phone */
@media(max-width:900px){
  .grid{grid-template-columns:repeat(3,1fr);max-width:640px}
  .empty{display:none}
  .cell{height:112px;font-size:14px}
}
@media(max-width:420px){
  :root{--gap:9px}
  .cell{height:98px;font-size:12.5px;border-radius:18px}
  .cell img{max-width:58%}
  .pill{height:42px;font-size:14px;padding-left:18px;padding-right:18px}
  .sound{height:42px;width:42px}
}
@media(prefers-reduced-motion:reduce){
  .cell,.cell img,.cell span,.pill,.sound,.cell::after{transition:none!important;animation:none!important}
  .cell:hover{transform:none}
}
</style>

<script>
(function(){
  var btn=document.getElementById('sound');
  var on=false, ctx=null;
  try{ on=localStorage.getItem('gridlink-sound')==='on'; }catch(e){}

  function setUI(){ btn.setAttribute('aria-pressed',on?'true':'false'); }
  setUI();

  function audio(){
    if(!ctx){
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      ctx=new AC();
    }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }

  function tone(freq,dur,type,vol,delay){
    var c=audio(); if(!c) return;
    var t=c.currentTime+(delay||0);
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t);
    o.frequency.exponentialRampToValueAtTime(freq*1.35,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.05,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+0.02);
  }

  var sfx={
    hover:function(i){ tone(520+(i%5)*70,0.09,'sine',0.035); },
    click:function(){ tone(660,0.09,'triangle',0.06); tone(990,0.14,'triangle',0.05,0.07); },
    on:function(){ tone(440,0.1,'triangle',0.06); tone(660,0.1,'triangle',0.06,0.09); tone(990,0.16,'triangle',0.06,0.18); },
    off:function(){ tone(990,0.1,'triangle',0.05); tone(660,0.1,'triangle',0.05,0.09); tone(440,0.16,'triangle',0.05,0.18); }
  };

  btn.addEventListener('click',function(){
    if(on){ sfx.off(); on=false; }
    else{ on=true; sfx.on(); }
    try{ localStorage.setItem('gridlink-sound',on?'on':'off'); }catch(e){}
    setUI();
  });

  var cells=[].slice.call(document.querySelectorAll('a.cell'));
  cells.forEach(function(el,i){
    el.style.setProperty('--i',i);
    el.addEventListener('pointerenter',function(e){
      if(on && e.pointerType==='mouse') sfx.hover(i);
    });
    el.addEventListener('focus',function(){ if(on) sfx.hover(i); });
    el.addEventListener('pointerdown',function(){ if(on) sfx.click(); });
  });

  var pill=document.querySelector('.pill');
  pill.addEventListener('pointerenter',function(e){ if(on && e.pointerType==='mouse') sfx.hover(2); });
  pill.addEventListener('pointerdown',function(){ if(on) sfx.click(); });
})();
</script>
